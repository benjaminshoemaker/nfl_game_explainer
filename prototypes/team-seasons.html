<script>
const DATA=/*SNAPSHOTS*/{};
const MODEL=/*MODEL*/null;
const POWER=/*POWER*/{};
const EVIDENCE=/*EVIDENCE*/null;
const SCHEDULE_AUDIT=/*SCHEDULE_AUDIT*/null;
const WEEKLY=/*WEEKLY*/null;
const signed=v=>Math.abs(v)<0.005?'0.00':(v>0?'+':'')+v.toFixed(2);
const power=()=>POWER[year];
const powerTeam=id=>power()?.teams.find(t=>t.id===id);
const labels={point_margin:'Adjusted scoring margin',quarterback:'Recent QB performance & continuity'};
function componentLabel(k,d){return labels[k]||d.factors.find(f=>f.id===k)?.label||k;}
function componentRank(r,k){const m=r.componentRanks?.[k];return m?`${m.tied?'T-':''}${m.rank} / ${m.rankPool}`:'Unavailable';}
function powerBenchmarks(r){const teams=power().teams;return {middle:teams[15],best:teams[0]};}
function powerRadar(r,d){
  const {middle,best}=powerBenchmarks(r), keys=Object.keys(r.contributions);
  if(!r.componentRanks)return '<p>Rebuild the power snapshot to show component rankings.</p>';
  const candidates=[{r,color:'#256875',dash:'',role:'Selected team'}, {r:middle,color:'#b66a1c',dash:'8 5',role:'16th overall'}, {r:best,color:'#8056a3',dash:'2 5',role:'1st overall'}];
  // A selected benchmark gets one profile and combined legend roles.
  const profiles=[];for(const p of candidates){const found=profiles.find(v=>v.r.id===p.r.id);if(found)found.role+=' · '+p.role;else profiles.push({...p});}
  const short={success_rate:['Success','rate'],yards_per_play:['Yards /','play'],explosive_rate:['Explosive','plays'],points_per_trip:['Points /','trip'],turnovers:['Turnovers'],field_position:['Field','position'],penalties:['Penalty','yards'],non_offensive_points:['Non-offensive','points'],point_margin:['Adjusted','scoring margin'],quarterback:['QB performance','& continuity']};
  const xy=(i,v)=>[450+Math.sin(i*2*Math.PI/keys.length)*v*1.95,315-Math.cos(i*2*Math.PI/keys.length)*v*1.95];
  const legend=profiles.map(p=>`<span class="profile-key"><svg viewBox="0 0 36 12" aria-hidden="true"><path d="M0 6H36" stroke="${p.color}" stroke-width="3" stroke-dasharray="${p.dash}"/></svg><a href="#team/${p.r.id}">${esc(d.teams.find(t=>t.id===p.r.id)?.name||p.r.id)}</a> · #${p.r.rank} · ${esc(p.role)}</span>`).join('');
  return `<h3>How the profile compares</h3><p>Each spoke shows a component’s league percentile in this model. Farther out means a stronger contribution to predicted strength. The benchmarks are the actual teams ranked 16th and 1st overall—not a composite of the best score on each spoke.</p><div class="profile-legend">${legend}</div><svg class="power-radar" viewBox="0 0 900 620" role="img" aria-label="Power components: ${esc(r.id)} compared with ${esc(middle.id)} ranked 16th overall and ${esc(best.id)} ranked first overall"><title>Ten-component model profile</title><desc>League percentiles from 0 to 100, higher is better. Exact ranks and point contributions are in the following table.</desc>${[25,50,75,100].map(v=>`<polygon points="${keys.map((_,i)=>xy(i,v).join(',')).join(' ')}" fill="none" stroke="#dce4e5"/><text x="457" y="${315-v*1.95+13}" font-size="11" fill="#667b80">${v}</text>`).join('')}${keys.map((k,i)=>{const [x,y]=xy(i,129),[ex,ey]=xy(i,100);return `<path d="M450 315L${ex} ${ey}" stroke="#e6eded"/><text x="${x}" y="${y}" text-anchor="middle" font-size="14">${(short[k]||[componentLabel(k,d)]).map((line,j)=>`<tspan x="${x}" dy="${j?17:0}">${esc(line)}</tspan>`).join('')}</text>`;}).join('')}${[...profiles].reverse().map(p=>`<polygon points="${keys.map((k,i)=>xy(i,p.r.componentRanks[k].percentile).join(',')).join(' ')}" fill="${p.r.id===r.id?p.color:'none'}" fill-opacity="0.07" stroke="${p.color}" stroke-width="${p.r.id===r.id?3:2}" stroke-dasharray="${p.dash}" stroke-linejoin="round"><title>${esc(p.r.id)} · ${esc(p.role)}</title></polygon>${keys.map((k,i)=>{const [x,y]=xy(i,p.r.componentRanks[k].percentile);return `<circle cx="${x}" cy="${y}" r="3" fill="${p.color}"><title>${esc(p.r.id)}: ${esc(componentLabel(k,d))}, ${componentRank(p.r,k)}, ${signed(p.r.contributions[k])} points</title></circle>`;}).join('')}`).join('')}</svg><p class="muted">Spokes use the same percentile scale, regardless of model weight. The chart shows the shape of the profile; it does not add up to the total rating. These are adjusted model components, distinct from the observed season factors above.</p>`;
}
const qbTermLabels={recent_qb_change:'Primary QB changed since preceding game',recent_qb_share:'Share of last game’s dropbacks',recent_qb_yards_per_dropback:'Historical yards per dropback',recent_qb_interception_rate:'Historical interception rate',recent_qb_history_games:'Historical games',recent_qb_missing:'History missing'};
function qbRaw(term){if(['recent_qb_change','recent_qb_missing'].includes(term.name))return term.value?'Yes':'No';if(['recent_qb_share','recent_qb_interception_rate'].includes(term.name))return (100*term.value).toFixed(2)+'%';return term.value.toFixed(term.name==='recent_qb_history_games'?0:2);}
function scheduleAuditView(){
 if(!SCHEDULE_AUDIT)return '';
 const models=SCHEDULE_AUDIT.models,names={incumbent_recipe:'Current recipe · annual historical refits',selected_schedule_procedure:'Schedule alternatives · selected on earlier years',strong_point_baseline:'Strong point-differential baseline'};
 const ci=SCHEDULE_AUDIT.comparisons.incumbent_recipe;
 return `<h2>Does stronger opponent adjustment help?</h2><p>We tested less prior-season influence, 1.5× and 2× current-opponent effects, and an explicit schedule-strength input. Each year’s choice used only the preceding three validation seasons. All forecasts used earlier-week inputs; schedule estimates excluded current-season games involving the team being assessed.</p><div class="scroll"><table><thead><tr><th>Procedure</th><th>Overall margin RMSE ↓</th><th>Weeks 1–5 ↓</th><th>Weeks 6+ ↓</th><th>Easy schedules ↓</th><th>Hard schedules ↓</th></tr></thead><tbody>${Object.entries(names).map(([k,n])=>{const m=models[k];return `<tr><th>${n}</th><td>${m.rmse.toFixed(3)}</td><td>${m.subgroups.early.rmse.toFixed(3)}</td><td>${m.subgroups.later.rmse.toFixed(3)}</td><td>${m.subgroups.easy.rmse.toFixed(3)}</td><td>${m.subgroups.hard.rmse.toFixed(3)}</td></tr>`;}).join('')}</tbody></table></div><p><b>Keep the frozen rating unchanged.</b> The selected schedule procedure changed overall error by ${ci.difference>0?'+':''}${ci.difference.toFixed(3)} points versus the incumbent recipe (exploratory 95% interval ${ci.lower.toFixed(3)} to ${ci.upper.toFixed(3)}). It improved ${SCHEDULE_AUDIT.seasonsImprovedVsIncumbent}/8 seasons. Early-season improvement did not carry through to a reliable overall gain.</p><p class="muted">2018–2025 retrospective evaluation. The current recipe is refitted using earlier seasons, rather than applying its final 2026 coefficients backward. Easy/hard groups are team-games in the bottom/top eight prior-week schedules; weeks without schedule history are excluded. Team-games are correlated, and this research is not fresh prospective confirmation. Schedule difficulty is itself an estimate, especially early in the year.</p>`;
}
function opponentContext(r,t,d){
 const a=r.scheduleDifficulty;if(!a)return '';
 const league=[...power().teams].filter(x=>x.scheduleDifficulty?.value!=null).sort((x,y)=>y.scheduleDifficulty.value-x.scheduleDifficulty.value||x.id.localeCompare(y.id));
 const name=id=>d.teams.find(team=>team.id===id)?.name||id;
 const evidence=r.evidenceContributions||{},current=Object.values(evidence).reduce((sum,v)=>sum+v.currentSeason,0),prior=Object.values(evidence).reduce((sum,v)=>sum+v.priorSeasons,0);
 return `<section class="opponent-explainer"><h4>Before Step 2: opponents and the evidence behind the rating</h4><p>The model estimates offense and defense together across the league. A strong result against an opponent that usually suppresses that factor earns more credit. Each opponent is judged in the context of its own opponents. Those factor-specific estimates enter the learned prediction formula.</p><h4>How difficult was ${esc(t.abbr)}’s schedule?</h4><div class="notice"><b>${a.rank==null?'No completed opponents':`${a.tied?'T-':''}${a.rank} of ${a.rankPool} · 1 = hardest schedule`}</b><p>${a.value==null?'Not yet available':`Average opponent strength: <b>${signed(a.value)} points versus an average team</b>. ${a.value>0?'Above zero means stronger opponents on average.':'Below zero means weaker opponents on average.'}`}</p><small>Completed schedule through Week ${power().throughWeek} · ${a.games} games · each game equally weighted.</small></div><p>Opponent strength here uses a separate, venue-adjusted scoring-margin model. For ${esc(t.abbr)}, we remove <b>all current-season games involving ${esc(t.abbr)}</b> before estimating its opponents. This prevents those results from directly making the schedule look easier or harder. Prior-season evidence remains, including historical meetings. These are estimates as of the snapshot cutoff, not pregame opponent rankings or our full ten-component power ratings.</p><div class="scroll"><table><thead><tr><th>Week</th><th>Opponent</th><th>Estimated opponent strength</th><th>Contribution to schedule average</th></tr></thead><tbody>${a.opponents.map(o=>`<tr><td>${o.week}</td><th><a href="#team/${o.id}">${esc(name(o.id))}</a></th><td>${signed(o.strength)} pts</td><td>${signed(o.contribution)} pts</td></tr>`).join('')}</tbody></table></div><details><summary>Compare schedule difficulty across the league · 1 = hardest</summary><div class="scroll"><table><thead><tr><th>Schedule rank</th><th>Team</th><th>Average opponent strength</th><th>Games</th></tr></thead><tbody>${league.map(x=>`<tr ${x.id===r.id?'class="added-input" aria-current="true"':''}><td>${x.scheduleDifficulty.tied?'T-':''}${x.scheduleDifficulty.rank}</td><th><a href="#team/${x.id}">${esc(name(x.id))}</a></th><td>${signed(x.scheduleDifficulty.value)} pts</td><td>${x.scheduleDifficulty.games}</td></tr>`).join('')}</tbody></table></div></details><h4>How much comes from this season?</h4><p>The estimates blend this season’s games with prior-season evidence. Recent games get more weight, and limited evidence is pulled toward average. Because those contributions differ by factor and can offset one another, there is no single “percent from this season” for the entire rating.</p><div class="rating-equation"><span><b>${signed(current)}</b>Current-season factor/scoring evidence</span><span>+</span><span><b>(${signed(prior)})</b>Prior-season factor/scoring evidence</span><span>+</span><span><b>(${signed(r.contributions.quarterback)})</b>QB history and continuity</span><span>=</span><span><b>${signed(r.rating)}</b>Rating points</span></div><details><summary>See current-season and prior-season contributions by component</summary><div class="scroll"><table><thead><tr><th>Component</th><th>Current-season contribution</th><th>Prior-season contribution</th><th>Total</th></tr></thead><tbody>${Object.entries(evidence).map(([k,v])=>`<tr><th>${esc(componentLabel(k,d))}</th><td>${signed(v.currentSeason)} pts</td><td>${signed(v.priorSeasons)} pts</td><td>${signed(v.currentSeason+v.priorSeasons)} pts</td></tr>`).join('')}</tbody></table></div></details><p class="muted">These are additive model contributions, not accuracy percentages or confidence levels. We hold the fitting weights and penalties fixed and separate the current-data response from the prior response. Zero prior evidence would still leave the same pull toward average. The QB contribution uses its own multi-season history and is shown separately.</p></section>`;
}
function calculationView(r,t,d){
 const trace=r.calculationTrace;if(!trace)return '';
 const keys=d.factors.map(f=>f.id), total=keys.reduce((sum,k)=>sum+r.contributions[k],0);
 const exact=v=>Math.abs(v)<0.0000005?'0.000000':v.toFixed(6);
 const terms=(k)=>trace[k].terms.map(term=>{const name=qbTermLabels[term.name]||(term.name.includes('_prevention_')?'Defense / prevention':term.name.includes('_own_')?'Offense / own':k==='point_margin'?'Adjusted scoring margin':'Net advantage');return `<tr><th>${esc(name)}</th><td>${exact(term.value)}</td><td>${exact(term.leagueMean)}</td><td>${exact(term.centeredValue)}</td><td>× ${exact(term.coefficient)}</td><td>${exact(term.points)}</td></tr>`;}).join('');
 return `<section class="calculation"><h3>How this rating is made</h3><p>Follow ${esc(t.abbr)} from observed performance to predicted strength. The raw statistics use different units; the final model converts them into a common unit: points.</p><h4>1. Start with the eight factors, then add scoring margin and QB context</h4><div class="scroll"><table><thead><tr><th>Input</th><th>Raw season performance through Week ${power().throughWeek}</th></tr></thead><tbody>${d.factors.map(f=>`<tr><th>${esc(f.label)}</th><td>Own ${fmt(t.factors[f.id].own.value,f)} · Opponent ${fmt(t.factors[f.id].opponent.value,f)}<small>Net advantage ${fmt(t.factors[f.id].net.value,f,true)} · ${esc(f.unit)} · ${rank(t.factors[f.id].net)}</small></td></tr>`).join('')}<tr class="added-input"><th>Added: scoring margin</th><td>${trace.point_margin.rawMargin==null?'Unavailable':signed(trace.point_margin.rawMargin)+' points per game'}<small>Points scored minus points allowed</small></td></tr><tr class="added-input"><th>Added: QB performance & continuity</th><td>${trace.quarterback.terms.map(term=>`<div>${esc(qbTermLabels[term.name])}: <b>${qbRaw(term)}</b></div>`).join('')}<small>Previous primary QB; historical rates cover this season and the previous two, through the snapshot cutoff. These are not opponent-adjusted.</small></td></tr></tbody></table></div>${opponentContext(r,t,d)}<h4>2. Estimate strength, accounting for opponents and limited evidence</h4><p>The model jointly estimates offense and defense. Recent games carry more weight (eight-week half-life); prior-season estimates regress halfway toward average and enter with eight prior-game units, plus two neutral units. Early-season raw results therefore do not enter at full strength.</p><p>The comparison below holds that prior, recency weighting and regularization fixed. Only current-season opponent terms are switched off in the first column and on in the second. The prior already contains historical opponent adjustment. This isolates the current-schedule effect; it is not a claim that the full difference from raw performance comes from opponents.</p><div class="scroll"><table><thead><tr><th>Component</th><th>Opponent terms off</th><th>Actual adjusted estimate</th><th>Change from opponents</th></tr></thead><tbody>${[...keys,'point_margin'].map(k=>{const f=d.factors.find(f=>f.id===k)||{unit:'points/game'},v=trace[k];return `<tr><th>${esc(componentLabel(k,d))}<small>${esc(f.unit)} · advantage relative to average</small></th><td>${fmt(v.beforeOpponent,f,true)}</td><td>${fmt(v.afterOpponent,f,true)}</td><td>${fmt(v.opponentDelta,f,true)}</td></tr>`;}).join('')}<tr><th>QB context</th><td colspan="3">No opponent adjustment. The six observed inputs above go directly to the learned formula.</td></tr><tr><th>Rest and venue</th><td colspan="3">Matchup inputs only. Excluded from this league power rating so every team is compared under equal conditions.</td></tr></tbody></table></div><p class="muted">Factor estimates here show offense + prevention, oriented so higher is better. They are advantages relative to average—not adjusted absolute success rates. The formula below also uses each offensive and defensive estimate separately. Missing observations are omitted from fitting; the prior still supplies an estimate.</p><h4>3. Convert every component into points using the learned coefficients</h4><p>For each term: <b>(model input − league average input) × coefficient</b>. Add the terms within a component. Net equals offense plus prevention, so their coefficients work together; a single coefficient’s sign should not be interpreted on its own. These are the actual multipliers; the standardized weight percentages elsewhere summarize effect size and are not multiplied into this calculation.</p>${[...keys,'point_margin','quarterback'].map(k=>`<details><summary>${esc(componentLabel(k,d))} → ${signed(r.contributions[k])} points · show calculation</summary><div class="scroll"><table><thead><tr><th>Term</th><th>Input</th><th>League mean</th><th>Centered input</th><th>Coefficient</th><th>Point contribution</th></tr></thead><tbody>${terms(k)}</tbody></table></div><p>Component total: ${exact(r.contributions[k])} points. Percentage inputs use fractions here (0.01 = one percentage point). Values shown are rounded; calculations use full precision.</p></details>`).join('')}<h4>4. Add the components to get one number</h4><div class="rating-equation"><span><b>${signed(total)}</b>Eight factors</span><span>+</span><span><b>(${signed(r.contributions.point_margin)})</b>Scoring margin</span><span>+</span><span><b>(${signed(r.contributions.quarterback)})</b>QB context</span><span>=</span><span><b>${signed(r.rating)}</b>Points vs average · #${r.rank} / 32</span></div><p>No additional percentage weighting is applied. The league mean is zero; rest, venue and the game-prediction intercept are excluded. Sort all 32 totals from highest to lowest to obtain the power rankings.</p></section>`;
}

const driverNames={success_rate:'Success rate',yards_per_play:'Yards per play',explosive_rate:'Explosive plays',points_per_trip:'Finishing drives',turnovers:'Turnovers',field_position:'Field position',penalties:'Penalties',non_offensive_points:'Non-offensive points',point_margin:'Scoring margin',quarterback:'QB context'};
let driverSort='contribution';
function orderedDrivers(r){
 const weights=power().componentWeights||{};
 return Object.entries(r.contributions).sort((a,b)=>{
  const score=([k,v])=>driverSort==='influence'?(Number.isFinite(weights[k]?.weightPercent)?weights[k].weightPercent:-Infinity):Math.abs(v);
  return score(b)-score(a)||a[0].localeCompare(b[0]);
 });
}
function driverRows(r){
 const weights=power().componentWeights||{};
 const extent=Math.max(2,Math.ceil(Math.max(...Object.values(r.contributions).map(Math.abs))));
 const influenceMax=Math.max(20,Math.ceil(Math.max(0,...Object.values(weights).map(w=>w.weightPercent))/5)*5);
 return orderedDrivers(r).map(([k,v])=>{const w=weights[k]?.weightPercent;return `<div class="grid row" data-component="${esc(k)}"><div class="factor">${esc(driverNames[k]||k)}<small>#${componentRank(r,k)}</small></div><div class="plot" role="img" aria-label="${esc(driverNames[k]||k)} contributes ${signed(v)} points"><i class="bar ${v<0?'negative':''}" style="left:${v<0?50+v/extent*50:50}%;width:${Math.abs(v)/extent*50}%"></i></div><div class="number">${signed(v)}</div><div class="influence"><span class="mobile-label">Model influence</span>${Number.isFinite(w)?`<span class="track" aria-hidden="true"><i style="width:${w/influenceMax*100}%"></i></span><span class="percent">${w.toFixed(1)}%</span>`:'<span>Unavailable</span>'}</div></div>`;}).join('');
}
function ratingDrivers(r,t,d){
 const entries=Object.entries(r.contributions),positive=entries.filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])[0],negative=entries.filter(([,v])=>v<0).sort((a,b)=>a[1]-b[1])[0];
 const phrases={yards_per_play:'yardage',success_rate:'success rate',explosive_rate:'explosive plays',points_per_trip:'finishing drives',point_margin:'scoring margin',quarterback:'QB context',field_position:'field position',turnovers:'turnovers',penalties:'penalties',non_offensive_points:'non-offensive points'};
 const first=positive?`Strong on ${phrases[positive[0]]||driverNames[positive[0]]}.`:'No positive model contribution.';
 const second=Math.abs(r.rating)<2?'Closer to average overall.':r.rating>=2?'Above average overall.':'Below average overall.';
 const deck=[positive?`${driverNames[positive[0]]} provides ${t.name}’s biggest lift.`:'No component raises this rating.',negative?`${driverNames[negative[0]]} is the largest offset.`:'No component lowers this rating.'].join(' ');
 const extent=Math.max(2,Math.ceil(Math.max(...Object.values(r.contributions).map(Math.abs))));
 const weights=power().componentWeights||{},influenceMax=Math.max(20,Math.ceil(Math.max(0,...Object.values(weights).map(w=>w.weightPercent))/5)*5);
 const current=WEEKLY&&String(WEEKLY.manifest.season)===String(year);
 const warnings=[current&&WEEKLY.status?.status==='failed'?'Latest refresh failed':'',current&&Date.now()-Date.parse(WEEKLY.manifest.publishedAt)>9*86400000?'Over nine days old':'',current&&Object.keys(WEEKLY.manifest.coverage.reasons||{}).length?'Source exclusions':'',r.qbHistoryMissing?'QB history unavailable':''].filter(Boolean);
 return `<div id="team-report"><div class="edition-nav"><span><a href="#teams">Teams</a> / ${esc(t.name)}</span><span id="team-season-slot"></span></div><div class="hero"><div><div class="kicker">${esc(t.name)} · ${rec(t)}</div><h1>${esc(first)}<br>${esc(second)}</h1><p class="deck">${esc(deck)}</p></div><aside class="rating" aria-label="Team power rating"><div class="kicker">Power rating</div><strong>${signed(r.rating)}</strong><span>points vs average</span><b>#${r.rank} <small>of 32 teams</small></b></aside></div><details class="source"><summary>Saved Week ${power().throughWeek} snapshot · Experimental model${warnings.length?' · '+warnings.join(' · '):''}</summary><div id="team-source-slot"></div><p>Equal rest; venue effects excluded. QB context reflects previous usage, not a confirmed next starter. This is not a season-record forecast.</p></details><section class="evidence" aria-label="Rating drivers"><div class="section-head"><div><h2>What drives the rating</h2><p>Team contribution and model influence, side by side.</p></div><label class="sort-label">Sort by <select id="driver-sort" aria-label="Sort rating drivers"><option value="contribution" ${driverSort==='contribution'?'selected':''}>Team contribution</option><option value="influence" ${driverSort==='influence'?'selected':''}>Model influence</option></select></label></div><div class="grid headings"><div>Component<small>Adjusted league rank</small></div><div>${esc(t.abbr)} contribution<small class="axis"><span>−${extent} pts</span><span>0</span><span>+${extent} pts</span></small></div><div></div><div class="influence-title">Model influence<small class="axis"><span>0%</span><span>${influenceMax}%</span></small></div></div><div class="rows">${driverRows(r)}</div><div class="grid total"><strong>Total rating</strong><div></div><strong class="number">${signed(r.rating)}</strong><span>Influence is fixed across teams.</span></div><p class="chart-note">Blue raises the rating; ochre lowers it. Influence shows typical model contribution size—not the share of prediction accuracy. Contributions sum before rounding.</p><span id="driver-sort-status" class="sr-only" aria-live="polite"></span></section></div>`;
}

function ratingCard(t,d){
  const r=powerTeam(t.id);if(!r)return `<div class="notice">No frozen-model rating for this season. The model was trained through 2025 and is only applied from 2026 onward.</div>`;
  const {middle,best}=powerBenchmarks(r);
  const weights=power().componentWeights||{};
  const gap=(other)=>`${signed(r.rating-other.rating)} points versus ${esc(other.id)} (#${other.rank})`;
  return `${ratingDrivers(r,t,d)}<details><summary>How to read model influence and coefficients</summary><p>Influence measures the typical spread of grouped contributions in training matchups. These shares sum to 100%; they are not percentages of prediction accuracy. Correlated factors share information.</p><div class="scroll"><table><thead><tr><th>Component</th><th>Model term</th><th>Raw coefficient</th></tr></thead><tbody>${Object.entries(weights).flatMap(([k,w])=>w.terms.map(term=>`<tr><th>${esc(componentLabel(k,d))}</th><td>${esc(term.feature)}</td><td>${term.coefficient.toPrecision(5)}</td></tr>`)).join('')}</tbody></table></div></details><details><summary>How ${esc(t.abbr)}’s rating adds up</summary>${calculationView(r,t,d)}</details><details><summary>Compare with the middle and top-ranked teams</summary><p>${gap(middle)} · ${gap(best)}. Positive favors ${esc(t.abbr)}.</p>${powerRadar(r,d)}<h3>What contributes to this rating?</h3><div class="scroll"><table><thead><tr><th>Component</th><th>Standardized model weight</th><th>${esc(t.abbr)} league rank</th><th>${esc(t.abbr)} contribution</th><th>${esc(middle.id)} · 16th overall</th><th>${esc(best.id)} · 1st overall</th></tr></thead><tbody>${Object.entries(r.contributions).map(([k,v])=>`<tr><th>${esc(componentLabel(k,d))}</th><td>${weights[k]?weights[k].weightPercent.toFixed(1)+'%':'Unavailable'}</td><td>${componentRank(r,k)}</td><td>${signed(v)} pts</td><td>${signed(middle.contributions[k])} pts<small>Rank ${componentRank(middle,k)}</small></td><td>${signed(best.contributions[k])} pts<small>Rank ${componentRank(best,k)}</small></td></tr>`).join('')}</tbody></table></div><p class="muted">Contributions sum to the rating before rounding. League ranks compare these model contributions across all 32 teams; they may differ from the raw season-factor ranks. Each factor combines its offensive, defensive, and net terms. These are predictive associations, not causal explanations.</p><details><summary>How to read the weights and coefficients</summary><p>The model has several coefficients per component, in different units. Standardized weight measures the typical spread of each combined component’s point contribution across 2012–2025 training matchups, divided by the sum of those spreads. We group the terms first to account for their overlap. Weights are fixed across teams and total 100% before rounding.</p><p>This is a comparable effect-size summary, not a literal percentage used in the prediction formula or the percentage of accuracy explained. Correlated components can share information. A high-weight component need not be this team’s largest contribution.</p><p>The exact prediction uses feature value × coefficient for every term. Net, own, and prevention terms are opponent-adjusted and prior-shrunk; raw season values cannot be substituted.</p><div class="scroll"><table><thead><tr><th>Component</th><th>Model term</th><th>Raw coefficient</th></tr></thead><tbody>${Object.entries(weights).flatMap(([k,w])=>w.terms.map(term=>`<tr><th>${esc(componentLabel(k,d))}</th><td>${esc(term.feature.replace('original_p8_h8_',''))}</td><td>${term.coefficient.toPrecision(5)}</td></tr>`)).join('')}</tbody></table></div></details></details>`;
}

function weeklyResults(){

 const table=e=>`<div class="scroll"><table><thead><tr><th>Predictor</th><th>Average error (MAE) ↓</th><th>RMSE ↓</th><th>Winner picks</th></tr></thead><tbody>${Object.entries(e.metrics).map(([k,m])=>`<tr><th>${labels[k]}</th><td>${m.mae==null?'Pending':m.mae.toFixed(2)}</td><td>${m.rmse==null?'Pending':m.rmse.toFixed(2)}</td><td>${m.winnerCorrect}/${m.winnerGames}</td></tr>`).join('')}</tbody></table></div>`;
 const r=WEEKLY.replay,p=WEEKLY.predictions,e=WEEKLY.prospective;
 return `${r?`<h2>${r.season} Week ${r.week} · retrospective replay</h2><p>Inputs stopped after Week ${r.week-1}. ${r.evaluation.games.length} completed games; ${r.evaluation.missingClosingLine.length} missing closing lines. All three predictors are scored on the same games. Tied games are excluded from winner picks.</p>${table(r.evaluation)}<p>MAE is the average distance between the predicted and actual scoring margins. RMSE gives larger misses more weight. Lower is better for both.</p><p><b>This was reconstructed after the games using corrected source data.</b> It was not a pregame publication. One week does not establish a lasting advantage over the market. Closing lines may reflect information arriving after our weekly cutoff; market data never enters the model.</p><details><summary>See every Week ${r.week} prediction</summary><p>All values are home minus away. Positive means the home team wins by that many points.</p><div class="scroll"><table><thead><tr><th>Away @ home</th><th>Actual</th><th>Our model</th><th>Point baseline</th><th>Closing line</th></tr></thead><tbody>${r.evaluation.games.map(g=>`<tr><th>${esc(g.away)} @ ${esc(g.home)}</th><td>${signed(g.actual)}</td><td>${signed(g.model)}</td><td>${signed(g.pointBaseline)}</td><td>${g.vegas==null?'Missing':signed(g.vegas)}</td></tr>`).join('')}</tbody></table></div><p><a href="${esc(r.report)}">Download full report</a> · <a href="https://nflreadr.nflverse.com/articles/dictionary_schedules.html">nflverse closing-line definitions</a></p></details>`:''}
 <h2>Pregame prediction archive</h2><p>${p.season} Week ${p.week}: <b>${p.games.length} forecasts saved before kickoff</b>, using completed games through Week ${p.inputThroughWeek}. Saved ${esc(new Date(p.publishedAt).toLocaleString())}. Both models are frozen; neither is retrained on this season.</p><p><a href="${esc(WEEKLY.archive)}">Open the archived predictions, feature values, timestamps and model hashes</a>. Original forecasts remain unchanged; later runs score the first archived prediction for each game. These are local dated, checksum-verified records, not an externally certified publication.</p>${e.totalForecasts?`<p>Previously archived forecasts: ${e.games.length}/${e.totalForecasts} final; ${e.pending.length} pending.</p>${table(e)}`:'<p>No earlier pregame forecasts have finished yet. The Week 5 replay is excluded from the prospective record.</p>'}`;
}

function renderPage(){const d=DATA[year];if(!d){app.textContent='Generate this prototype with research/render_team_prototype.py.';return}$('#cutoff').textContent=`Through Week ${d.throughWeek} · ${d.availableGames}/${d.expectedGames} completed games`;$('#freshness').innerHTML=weeklyFreshness();const path=location.pathname.replace(/\/$/,'');let route=location.hash.slice(1)||({'/power-rankings':'power','/power-rankings/prediction-results':'results','/prediction-results':'results','/team-methodology':'method'}[path])||(path.startsWith('/teams/')?'team/'+decodeURIComponent(path.slice(7)).toUpperCase():'teams');
if(route.startsWith('team/')){let t=d.teams.find(t=>t.id===route.slice(5));if(!t){location.hash='teams';return}app.innerHTML=`${powerTeam(t.id)?'':`<div class="eyebrow">Team season · ${year}</div><h1>${esc(t.name)}</h1><p>${rec(t)} · ${t.gamesAvailable} games.</p>`}${ratingCard(t,d)}<details><summary>Observed season statistics · offense, defense & net advantage</summary><div class="scroll"><table><thead><tr><th>Factor</th><th>Own / offense</th><th>Opponent / defense</th><th>Net advantage</th></tr></thead><tbody>${d.factors.map(f=>`<tr><th>${f.label}<small>${f.unit}</small></th>${['own','opponent','net'].map(k=>{let m=t.factors[f.id][k];return `<td>${fmt(m.value,f,k==='net')}<small>${rank(m)}</small><span class="bar"><i style="width:${m.percentile??0}%"></i></span></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">Higher net values are always better. Turnover and penalty advantages reverse the subtraction. Ranks use complete coverage; partial values remain visible.</p></details><p><a href="#power">Explore league comparisons →</a></p><h2>Schedule & results</h2><div class="scroll"><table><thead><tr><th>Week</th><th>Opponent</th><th>Result</th></tr></thead><tbody>${t.schedule.map(g=>`<tr><td>${g.week}</td><td>${g.homeAway==='away'?'@ ':''}<a href="#team/${g.opponentId}">${g.opponent}</a></td><td>${g.final?`${g.score>g.opponentScore?'W':g.score<g.opponentScore?'L':'T'} ${g.score}–${g.opponentScore}`:'Upcoming'}</td></tr>`).join('')}</tbody></table></div>`;
}else if(route==='power'){app.innerHTML=`<div class="eyebrow">League comparison</div><h1>Power rankings</h1><div class="notice">Expected team strength right now, measured in points versus an average team. The model predicts upcoming-game scoring margin; it does not predict final season standings.</div>${predictionSummary()}${powerTable(d)}<h2>Compare any two metrics</h2><p>Factor axes show observed season performance. The power-rating axis shows estimated future strength.</p><div class="toolbar"><label>Perspective <select id="mode">${['net','own','opponent'].map(k=>`<option ${mode===k?'selected':''}>${k}</option>`).join('')}</select></label>${['x','y'].map((k,i)=>`<label>${k.toUpperCase()} axis <select id="${k}" aria-label="${k.toUpperCase()} axis">${[...d.factors,...(power()?[{id:'power_rating',label:'Power rating (points vs average)'}]:[])].map((f,j)=>`<option value="${f.id}" ${j===i?'selected':''}>${f.label}</option>`).join('')}</select></label>`).join('')}</div><div id="scatter"></div><h2>Eight-factor profile</h2><p>League percentiles, oriented so farther out is better. Select any number of teams; the table keeps larger comparisons readable. Missing ranks break the profile rather than becoming zero.</p><div class="checks">${d.teams.map(t=>`<label><input type="checkbox" value="${t.id}" ${selected.has(t.id)?'checked':''}>${t.abbr}</label>`).join('')}</div><div id="radar"></div><div id="comparison" class="scroll"></div>`;['x','y','mode'].forEach(k=>$('#'+k).onchange=()=>{mode=$('#mode').value;charts()});document.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.value):selected.delete(i.value);charts()});charts();if(power()){['a','b'].forEach(k=>$('#match-'+k).onchange=matchup);matchup();}
}else if(route==='method'){app.innerHTML=`<div class="eyebrow">How to read this</div><h1>Eight factors. Explicit definitions.</h1><p>Success means gaining 40% of the distance on first down, 60% on second, and 100% on third or fourth. Explosive gains are 20+ yards on dropbacks (including scrambles and sacks) and 10+ on runs. These are the app’s definitions, not nflverse’s EPA-based success flag.</p><p>Season rates divide summed numerators by summed opportunities. Defense shows opponents’ corresponding output. Net uses games with both sides available. Turnovers include lost fumbles, interceptions, and successful onside recoveries against the receiving team. Non-offensive points include return touchdowns, their conversions, and safeties.</p><p>Ranks use complete factor coverage and competition ties. Penalty yards use provider-attributed play records. Starting position is measured from the team’s own goal line. Points per trip includes offensive touchdowns from outside the 40.</p><h2>Experimental predictive model</h2><p>Learn factor weights on earlier seasons, adjust jointly for offense, defense, and opponents, and shrink small samples toward conservative prior-season information. Odds, market rankings, and imported power ratings are excluded from inputs.</p><h2>What the power rating predicts</h2><p>The frozen model predicts home-minus-away scoring margin in an upcoming game using earlier weeks. Its team-strength component is centered on the league, with rest and venue/designation terms excluded. A +6 team versus a +2 team has a four-point neutral strength advantage. The original matchup prediction adds the learned designation offset and rest/neutral-site terms separately. This does not forecast final wins or playoff odds.</p><p>Recent QB performance and continuity use the last observed primary passer, his usage share, a change indicator, historical yards per dropback, interception rate, and sample size. They do not identify a confirmed upcoming starter.</p><p>The model was fitted on 2012–2025. We do not apply these final coefficients to 2024 or 2025 pages, which would imply knowledge of later outcomes. Current review ratings are retrospective snapshots and retain the original adjusted-feature definitions; setting neutral conditions does not refit historical ratings to remove venue exposure.</p>`;
 }else if(route==='results'){app.innerHTML=`<p class="breadcrumb"><a href="#power">← Power rankings</a></p><div class="eyebrow">Power rankings · saved forecasts</div><h1>Prediction results</h1>${weeklyResults()}<h2>Historical model research</h2><div class="notice"><b>A modest historical improvement, awaiting prospective validation</b><p>The selected procedure predicts upcoming-game scoring margin. It has not been shown to outperform FPI or DVOA, or to predict final season records better.</p></div>${EVIDENCE?`<p>2018–2025 · 2,127 games · Each annual fit and selection used earlier seasons; game inputs used earlier weeks.</p><table><thead><tr><th>Model / procedure</th><th>Margin RMSE (points) ↓</th></tr></thead><tbody><tr><th>Eight factors + adjusted scoring margin + context + QB history</th><td>${EVIDENCE.full.toFixed(3)}</td></tr><tr><th>Strong fixed point-differential comparator</th><td>${EVIDENCE.baseline.toFixed(3)}</td></tr><tr><th>Point differential + context + QB history</th><td>${EVIDENCE.pointQb.toFixed(3)}</td></tr></tbody></table><p>RMSE measures scoring-margin error; lower is better. The improvement over the strong point baseline is ${(EVIDENCE.baseline-EVIDENCE.full).toFixed(3)} points. Its exploratory 95% season-block interval is ${EVIDENCE.interval.lower.toFixed(3)} to ${EVIDENCE.interval.upper.toFixed(3)} points for full model minus baseline.</p>`:'<p>Research evidence unavailable. Rebuild the review with the audited artifacts.</p>'}<h2>What this evidence does—and does not—establish</h2><p>These results evaluate annual model selection and refitting, not the final frozen coefficient vector applied retrospectively to every season. Historical outcomes informed model design across repeated experiments. The confidence interval does not correct for that search, and corrected source snapshots were used. This is a promising retrospective result, not untouched prospective proof.</p>${scheduleAuditView()}${WEEKLY?'':'<h2>Prospective validation</h2><p>No prospective predictions have been published by this review. Already completed games cannot be relabeled as prospective forecasts.</p>'}<p>The season selector changes team and factor pages. The historical research tables cover 2018–2025; weekly replay and pregame results are labeled separately.</p>`;
}else{app.innerHTML=`<div class="eyebrow">The league at a glance</div><h1>32 teams. Eight ways to compare.</h1><p>Explore each team’s season performance, defensive results, and league standing.</p><div class="cards">${d.teams.map(t=>`<div class="card"><a href="#team/${t.id}">${esc(t.name)}</a><p>${rec(t)} <span class="muted">· ${t.gamesAvailable} games</span></p>${powerTeam(t.id)?`<small>Power #${powerTeam(t.id).rank} · ${signed(powerTeam(t.id).rating)} points vs average</small>`:''}<small>Success-rate advantage ${fmt(t.factors.success_rate.net.value,d.factors[0],true)} · ${rank(t.factors.success_rate.net)}</small></div>`).join('')}</div>`}}
function charts(){let d=DATA[year],metrics=[...d.factors,{id:'power_rating',label:'Power rating',unit:'points'}],xf=metrics.find(f=>f.id===$('#x').value),yf=metrics.find(f=>f.id===$('#y').value),value=(t,f)=>f.id==='power_rating'?powerTeam(t.id)?.rating:t.factors[f.id][mode].value,pts=d.teams.map(t=>({t,x:value(t,xf),y:value(t,yf)})).filter(p=>p.x!=null&&p.y!=null);let extent=k=>{let a=pts.map(p=>p[k]),lo=Math.min(...a),hi=Math.max(...a);return[lo,hi===lo?lo+1:hi]};let [xl,xh]=extent('x'),[yl,yh]=extent('y'),sx=v=>80+(v-xl)/(xh-xl)*820,sy=v=>430-(v-yl)/(yh-yl)*350;
$('#scatter').innerHTML=`<svg viewBox="0 0 1000 510" role="img" aria-label="League scatterplot"><path d="M80 60V430H920" fill="none" stroke="#aac3c6"/>${pts.map(p=>`<a href="#team/${p.t.id}"><circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="#4f8991"/><text x="${sx(p.x)+7}" y="${sy(p.y)-6}" font-size="12">${p.t.abbr}</text><title>${p.t.name}: ${fmt(p.x,xf,mode==='net')}, ${fmt(p.y,yf,mode==='net')}</title></a>`).join('')}<text x="500" y="490" text-anchor="middle">${xf.label}: ${fmt(xl,xf,mode==='net')} to ${fmt(xh,xf,mode==='net')}</text><text x="80" y="30">${yf.label}: ${fmt(yl,yf,mode==='net')} to ${fmt(yh,yf,mode==='net')}</text></svg><small>${pts.length} of 32 teams plotted. Partial values may be included; see team coverage.</small>`;
let ts=d.teams.filter(t=>selected.has(t.id)),colors=['#397b86','#bd5849','#7969ab','#a57721','#4f8764','#aa5795'],xy=(i,v)=>[350+Math.sin(i*Math.PI/4)*v*1.65,240-Math.cos(i*Math.PI/4)*v*1.65];
$('#radar').innerHTML=`<svg viewBox="0 0 700 490" role="img" aria-label="Eight-factor team profiles">${[25,50,75,100].map(v=>`<polygon points="${d.factors.map((_,i)=>xy(i,v).join(',')).join(' ')}" fill="none" stroke="#dce4e5"/>`).join('')}${d.factors.map((f,i)=>{let [x,y]=xy(i,125);return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11">${f.label}</text>`}).join('')}${ts.map((t,j)=>{let vals=d.factors.map(f=>t.factors[f.id][mode].percentile);return vals.map((v,i)=>v!=null&&vals[(i+1)%8]!=null?`<path d="M${xy(i,v).join(',')} L${xy((i+1)%8,vals[(i+1)%8]).join(',')}" fill="none" stroke="${colors[j%6]}" stroke-width="2"><title>${t.abbr}</title></path>`:'').join('')}).join('')}</svg>`;
$('#comparison').innerHTML=`<table><thead><tr><th>Team</th>${d.factors.map(f=>`<th>${f.label}</th>`).join('')}</tr></thead><tbody>${ts.map((t,j)=>`<tr><th style="color:${colors[j%6]}">${t.abbr}</th>${d.factors.map(f=>`<td>${fmt(t.factors[f.id][mode].value,f,mode==='net')}<small>${rank(t.factors[f.id][mode])}</small></td>`).join('')}</tr>`).join('')}</tbody></table>`}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#')){e.preventDefault();location.hash=a.getAttribute('href');}});window.onhashchange=render;render();

function render(){
 // Keep the persistent publication notice outside the app while it is replaced.
 const freshness=document.querySelector('#freshness'),toolbar=document.querySelector('main .toolbar');
 document.querySelector('main').prepend(toolbar,freshness);
 renderPage();
 const title=document.querySelector('#app h1');
 const report=document.querySelector('#team-report');document.body.classList.toggle('team-page',!!report);
 if(report){document.querySelector('#team-source-slot').append(freshness);document.querySelector('#team-season-slot').append(toolbar);const select=document.querySelector('#driver-sort');select.onchange=()=>{driverSort=select.value;const route=location.hash.slice(1)||('team/'+location.pathname.split('/').pop().toUpperCase());const r=powerTeam(route.slice(5));if(r){report.querySelector('.rows').innerHTML=driverRows(r);document.querySelector('#driver-sort-status').textContent='Sorted by '+select.selectedOptions[0].textContent;}};}
 else if(title){const next=title.nextElementSibling;const lead=next&&(next.tagName==='P'||next.classList.contains('notice'))?next:title;lead.after(freshness);}

 document.querySelectorAll('#app table').forEach(table=>{if(!table.parentElement.classList.contains('scroll')){const box=document.createElement('div');box.className='scroll';table.before(box);box.append(table);}});
 document.querySelectorAll('#app table').forEach(table=>{if(table.rows[0]?.cells.length>3)table.parentElement.classList.add('wide');});
 document.querySelectorAll('.power-radar').forEach(chart=>{const box=document.createElement('div');box.className='chart-scroll';chart.before(box);box.append(chart);});
 document.querySelectorAll('.scroll,.chart-scroll,#scatter,#radar').forEach(box=>{box.tabIndex=0;box.setAttribute('role','region');box.setAttribute('aria-label',box.querySelector('svg')?.getAttribute('aria-label')||'Evidence table — scroll horizontally for more');});
 const path=location.pathname;const route=location.hash.slice(1)||({'/power-rankings':'power','/power-rankings/prediction-results':'results','/prediction-results':'results','/team-methodology':'method'}[path])||'teams';
 document.querySelectorAll('nav a').forEach(link=>{const active=link.hash.slice(1)===(route==='results'?'power':route.startsWith('team/')?'teams':route);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});
 const heading=document.querySelector('#app h1');if(heading)document.title=(report?report.querySelector('.kicker').textContent:heading.textContent)+' · Game Explained';
}
